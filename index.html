<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单气象网站</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f8ff;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        select, button {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
        }
        .weather-info {
            margin-top: 20px;
        }
        .day {
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>简单气象网站</h1>
        <select id="city-select">
            <option value="Shanghai">上海</option>
            <option value="Beijing">北京</option>
            <option value="Guangzhou">广州</option>
            <option value="Shenzhen">深圳</option>
            <option value="Chengdu">成都</option>
            <!-- 添加更多城市选项 -->
        </select>
        <button onclick="getWeather()">获取天气</button>

        <div id="weather-info" class="weather-info"></div>
    </div>

    <script>
        const apiKey = 'YOUR_API_KEY_HERE'; // 替换为你的OpenWeatherMap API密钥

        function getWeather() {
            const city = document.getElementById('city-select').value;
            const apiUrl = `https://api.openweathermap.org/data/2.5/forecast?q=${city},CN&units=metric&appid=${apiKey}`;
            
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    const weatherInfoDiv = document.getElementById('weather-info');
                    weatherInfoDiv.innerHTML = '';

                    for (let i = 0; i < data.list.length; i += 8) { // 每天有8个时间点的数据
                        const dayData = data.list[i];
                        const date = new Date(dayData.dt * 1000).toLocaleDateString();
                        const temperature = Math.round(dayData.main.temp);
                        const description = dayData.weather[0].description;
                        
                        const dayDiv = document.createElement('div');
                        dayDiv.className = 'day';
                        dayDiv.innerHTML = `
                            <p>${date}</p>
                            <p>温度：${temperature}°C</p>
                            <p>描述：${description}</p>
                        `;
                        weatherInfoDiv.appendChild(dayDiv);
                    }
                })
                .catch(error => {
                    console.error('Error fetching weather data:', error);
                });
        }
    </script>
</body>
</html>
